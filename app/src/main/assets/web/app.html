<!doctype html><html lang="he" dir="rtl"><head><title>יומן כושר ביתי</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16201C"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: right-hand rail on desktop, bottom tab bar on phone; one column of cards; every training day owns a color that follows it everywhere */
:root{
  --bg:#F2F6FC; --surface:#FFFFFF; --sunk:#EDF2F9; --ink:#1B2433; --muted:#5A687D; --line:#DAE2ED;
  --tape:#FF8A3D; --tape-ink:#2B1300; --tape-soft:#FFE9DA;
  --walk:#0E9F9A; --walk-soft:#D3F2EF;
  --c-legs:#1FAA6E; --c-push:#FF7A3D; --c-pull:#3B7BF0; --c-sh:#8A5CF6; --c-core:#E8478F; --c-walk:#0E9F9A; --c-rest:#94A3B8;
  --good:#1F8F4E; --warn:#C25E0A; --bad:#C62E2E;
  --fig:#22304A; --fig2:#A6B4C9; --prop:#D2DBE8; --bodyoff:#DCE4EF;
  --display:"Rubik","Arial Hebrew",Arial,system-ui,sans-serif;
  --body:"Rubik","Arial Hebrew",Arial,system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --surface:#18202F; --sunk:#131A27; --ink:#E8EEF7; --muted:#9AA8BD; --line:#2A3446;
  --tape:#FF9A55; --tape-ink:#2B1300; --tape-soft:#3B2618;
  --walk:#3CC7C0; --walk-soft:#123533;
  --c-legs:#3CCB8A; --c-push:#FF9A5E; --c-pull:#6C9CFF; --c-sh:#A88BFF; --c-core:#FF6EAD; --c-walk:#3CC7C0; --c-rest:#7A879B;
  --good:#5FD38B; --warn:#F2A35C; --bad:#FF8A80;
  --fig:#E3EAF5; --fig2:#5D6B82; --prop:#2E384B; --bodyoff:#2A3446; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#18202F; --sunk:#131A27; --ink:#E8EEF7; --muted:#9AA8BD; --line:#2A3446;
  --tape:#FF9A55; --tape-ink:#2B1300; --tape-soft:#3B2618;
  --walk:#3CC7C0; --walk-soft:#123533;
  --c-legs:#3CCB8A; --c-push:#FF9A5E; --c-pull:#6C9CFF; --c-sh:#A88BFF; --c-core:#FF6EAD; --c-walk:#3CC7C0; --c-rest:#7A879B;
  --good:#5FD38B; --warn:#F2A35C; --bad:#FF8A80;
  --fig:#E3EAF5; --fig2:#5D6B82; --prop:#2E384B; --bodyoff:#2A3446; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px;max-width:1080px;width:100%;margin-inline:auto;min-width:0}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:6px 4px;border-radius:10px;min-width:56px;cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav button svg{color:var(--tc,var(--muted))}
.nav button[aria-current="page"]{background:color-mix(in srgb,var(--tc) 14%,transparent)}
.nav button{min-width:50px}
.brand{display:none}
@media (min-width:900px){
  .app{grid-template-columns:max-content 1fr}
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-left:1px solid var(--line);padding:16px 8px;grid-column:1;grid-row:1}
  .main{grid-column:2;grid-row:1;padding-block:28px 60px}
  .nav button{flex-direction:row;gap:10px;font-size:15px;padding:9px 10px;justify-content:flex-start}
  .brand{display:block;font-family:var(--display);font-size:22px;line-height:1.1;font-weight:800;padding:4px 8px 16px}
  .brand .bver{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
  .brand small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400;margin-top:6px}
}
/* type */
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.h1{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.15}
.h2{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.2}
.h3{font-size:16px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-size:36px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.tape{height:10px;background:repeating-linear-gradient(to left,var(--tape) 0 1px,transparent 1px 8px),linear-gradient(var(--tape-soft),var(--tape-soft));background-size:auto 6px,auto;background-repeat:repeat-x;background-position:bottom,0 0;border-radius:3px;opacity:.9}
.tape.walk{background:repeating-linear-gradient(to left,var(--walk) 0 1px,transparent 1px 8px),linear-gradient(var(--walk-soft),var(--walk-soft));background-size:auto 6px,auto;background-repeat:repeat-x;background-position:bottom,0 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--tape);border-color:var(--tape);color:var(--tape-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.05)}
.btn.walk{background:var(--walk);border-color:var(--walk);color:var(--surface);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daychip{border-color:color-mix(in srgb,var(--dc) 45%,var(--line))}
.daychip[aria-pressed="true"]{background:var(--dc);border-color:var(--dc);color:#fff;font-weight:600}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input[type=number],input[type=date],input[type=time],input[type=text],input[type=password],select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{border-color:var(--tape);outline:none}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.pill.tape{background:var(--tape-soft);color:var(--ink)}
.pill.walk{background:var(--walk-soft);color:var(--walk)}
.pill.warn{background:var(--tape-soft);color:var(--warn)}
.pill.good{color:var(--good)}
.note{border-inline-start:3px solid var(--tape);background:var(--sunk);padding:10px 12px;border-radius:8px;font-size:14px}
.note.walkn{border-color:var(--walk)}
.note.warnn{border-color:var(--warn)}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;background:var(--surface);min-width:0}
.day.today{border-color:var(--ink);border-width:2px}
.day .dn{font-size:12px;color:var(--muted)}
.day .dt{font-size:13px;font-weight:600;margin-top:2px;line-height:1.2}
.day{background:color-mix(in srgb,var(--dc) 12%,var(--surface));border-color:color-mix(in srgb,var(--dc) 35%,var(--line))}
.day .dt{font-size:12px;overflow-wrap:anywhere;color:color-mix(in srgb,var(--dc) 70%,var(--ink))}
.sect{display:flex;align-items:center;gap:8px;color:color-mix(in srgb,var(--dc) 70%,var(--ink))}
.sect::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--dc)}
.daycard1{background:linear-gradient(160deg,color-mix(in srgb,var(--dc) 18%,var(--surface)),var(--surface) 70%);border-color:color-mix(in srgb,var(--dc) 40%,var(--line))}
.wgrid2{display:grid;grid-template-columns:50px repeat(7,minmax(0,1fr));gap:3px;align-items:stretch}
.wh{text-align:center;font-size:12px;font-weight:600;line-height:1.2;padding:4px 0;border-radius:8px}
.wh.today{background:var(--ink);color:var(--bg)}.wh.today .muted{color:inherit}
.wl{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center}
.wc{font-size:11px;text-align:center;border-radius:8px;padding:5px 1px;min-width:0;background:color-mix(in srgb,var(--dc) 14%,var(--surface));color:color-mix(in srgb,var(--dc) 70%,var(--ink));border:1px dashed color-mix(in srgb,var(--dc) 50%,var(--line));overflow-wrap:anywhere;line-height:1.25}
.wc.done{background:var(--dc);color:#fff;border-style:solid;font-weight:600}
.wc.empty{background:transparent;border-color:var(--line);color:var(--muted)}
.wdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c-walk);vertical-align:middle}
.day .mk{margin-top:4px;height:6px;border-radius:3px;background:var(--dc);opacity:.45}
.day .mk.done{opacity:1}
.day.today{border-color:var(--dc);box-shadow:0 0 0 2px var(--dc)}
.daycard{display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--dc) 22%,var(--surface)),var(--surface) 70%);border-color:color-mix(in srgb,var(--dc) 40%,var(--line))}
.daycard .h2{color:color-mix(in srgb,var(--dc) 65%,var(--ink))}
.pill.dayp{background:color-mix(in srgb,var(--dc) 18%,var(--surface));color:color-mix(in srgb,var(--dc) 60%,var(--ink))}
.bmap{width:100%;max-width:160px;height:auto;display:block}
.bmap.mini{max-width:110px;margin-inline:auto}
.plancard{border-top:6px solid var(--dc)}
.plancard .h3{color:color-mix(in srgb,var(--dc) 65%,var(--ink));font-size:18px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px;align-items:start}
.pghead{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;align-items:start}
.bmap.tiny{max-width:84px}
.g3p{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.pgroups{display:flex;flex-direction:column;gap:10px;min-width:0}
.pg{display:flex;flex-direction:column;gap:2px}
.pgh{font-size:13px;font-weight:700;color:color-mix(in srgb,var(--dc) 70%,var(--ink));background:color-mix(in srgb,var(--dc) 14%,var(--surface));border-radius:8px;padding:3px 10px;align-self:flex-start}
.pgx{display:flex;gap:8px;align-items:baseline;background:none;border:0;padding:3px 2px;font-size:15px;color:var(--ink);cursor:pointer;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pgx:hover{color:color-mix(in srgb,var(--dc) 70%,var(--ink));text-decoration:underline}
.pgn{font-size:12px;color:var(--muted);min-width:16px}
.schrow{display:grid;grid-template-columns:minmax(110px,1fr) auto 2fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.schrow.today{background:var(--sunk);border-radius:12px;padding-inline:10px}
@media (max-width:560px){.schrow{grid-template-columns:1fr 1fr}.schrow>.row{grid-column:1/-1}}
.plancard ol{margin:0;padding-inline-start:20px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.plancard.today{box-shadow:0 0 0 3px var(--dc)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:-6px 0 14px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.35}
.mhead b{color:var(--ink);font-size:14px}
@media (min-width:900px){.mhead{display:none}}
.appfoot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--muted)}
.helpfab{position:fixed;z-index:25;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--c-sh);color:#fff;font-size:26px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
@media (min-width:900px){.helpfab{bottom:24px}}
.helpmenu{position:fixed;z-index:26;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(146px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.2);min-width:220px}
@media (min-width:900px){.helpmenu{bottom:84px}}
.helpmenu button,.helpmenu a{display:block;text-align:start;background:none;border:0;padding:10px 12px;border-radius:10px;font-size:15px;cursor:pointer;color:var(--ink);text-decoration:none}
.helpmenu button:hover,.helpmenu a:hover{background:var(--sunk)}
.tour-hole{position:fixed;z-index:60;border-radius:14px;box-shadow:0 0 0 4px var(--c-sh),0 0 0 9999px rgba(12,18,30,.62);pointer-events:none;transition:all .25s ease}
.tour-bub{position:fixed;z-index:61;background:var(--surface);color:var(--ink);border-radius:18px;padding:16px;width:min(340px,calc(100vw - 24px));box-shadow:0 14px 40px rgba(0,0,0,.3);border:2px solid var(--c-sh)}
.tour-bub h4{margin:0 0 6px;font-size:18px;color:var(--c-sh)}
.tour-bub p{margin:0 0 12px;font-size:15px;line-height:1.55}
.tour-bub .tb{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tour-bub .btn.pri{background:var(--c-sh);border-color:var(--c-sh);color:#fff}
.tour-block{position:fixed;inset:0;z-index:59}
/* the tab bar stays on top of the tour so it can always be tapped */
body .nav{z-index:62}
.day .ok{font-size:11px;color:var(--good);font-weight:600;min-height:16px}
/* exercise */
.anim{width:100%;aspect-ratio:200/160;max-width:100%;display:block;background:var(--sunk);border-radius:10px}
.excard{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px}
.excard:hover{border-color:var(--muted)}
.excard .nm{font-weight:600}
.wex{border-top:5px solid var(--dc,var(--line))}
.wex{display:grid;grid-template-columns:1fr 150px;gap:14px;align-items:start}
@media (max-width:560px){.wex{grid-template-columns:1fr 104px;gap:10px}.daycard{grid-template-columns:1fr 92px}}
.mus{font-size:14px;margin:4px 0 2px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.recb{background:var(--sunk);border-radius:12px;padding:8px 10px;font-size:13px;margin:6px 0;display:flex;flex-direction:column;gap:2px}
.recb b{color:color-mix(in srgb,var(--dc,var(--tape)) 65%,var(--ink))}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px;align-items:center}
.sethead{font-size:12px;color:var(--muted);font-weight:600;text-align:center}
.set .i{font-size:12px;color:var(--muted);text-align:center}
.set input{padding:7px 8px;text-align:center}
.chk{width:44px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;display:grid;place-items:center}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.timer{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 24px));background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer .tl{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.timer .t{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
.timer .nx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer .tb{display:flex;gap:6px}
.timer button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.goon{position:fixed;inset:0;z-index:50;background:rgba(10,15,13,.72);display:grid;place-items:center;padding:24px}
.go-w{background:var(--tape);color:var(--tape-ink);border-radius:24px;padding:28px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;width:min(420px,100%)}
.go-big{font-family:var(--display);font-size:84px;line-height:1;font-weight:800}
.go-sub{font-size:18px;font-weight:600}
.go-w .btn{background:var(--tape-ink);color:var(--tape);border-color:var(--tape-ink);font-size:17px;padding:12px 26px}
@media (min-width:900px){.timer{bottom:24px}}
/* table */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
.dn-good{color:var(--good)} .dn-bad{color:var(--bad)}
/* dialog */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,15,13,.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
ol.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.wstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.wst{background:var(--walk-soft);border-radius:14px;padding:10px 12px}
.walkc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-inline-start:5px solid var(--c-walk)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px 12px}
.howgrid{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:start}
.howlist{display:flex;flex-direction:column;gap:2px;min-width:0}
.howi{background:none;border:0;border-radius:10px;padding:6px 10px;text-align:start;font-size:14px;color:var(--ink);cursor:pointer;line-height:1.45}
.howi.on{background:var(--tape-soft)}
.howi b{color:color-mix(in srgb,var(--tape) 60%,var(--ink))}
.tapefig{width:100%;height:auto;position:sticky;top:12px}
.tp{opacity:0;transition:opacity .3s}
.tp.on{opacity:1}

var REST={end:0,iv:null,next:""};
function audioCtx(){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;var c=audioCtx.c||(audioCtx.c=new C());if(c.state==="suspended")c.resume();return c}
function tone(f,t,len,vol){try{var c=audioCtx();if(!c)return;var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(vol||.2,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+len);o.start(c.currentTime+t);o.stop(c.currentTime+t+len+.02)}catch(e){}}

function say(txt){if(FA){try{FA.speak(txt);return}catch(e){}}try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(txt);u.lang="he-IL";u.rate=.95;var v=speechSynthesis.getVoices().find(function(x){return/^he|iw/i.test(x.lang)});if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function startRest(sec,next){
  REST.end=Date.now()+sec*1000;REST.next=next||"";clearInterval(REST.iv);
  var el=document.getElementById("timer");el.hidden=false;
  el.innerHTML='<div class="tl"><span class="small">מנוחה</span><span class="t" id="r-t"></span></div><div class="nx small" id="r-nx"></div><div class="tb"><button type="button" id="r-plus">+15</button><button type="button" id="r-stop">דלג</button></div>';
  document.getElementById("r-nx").textContent=REST.next?("הבא: "+REST.next):"";
  document.getElementById("r-plus").onclick=function(){REST.end+=15000;restTick()};
  document.getElementById("r-stop").onclick=function(){stopRest()};
  audioCtx();restTick();REST.iv=setInterval(restTick,250);
}
function restTick(){
  if(!REST.end)return;
  var left=Math.ceil((REST.end-Date.now())/1000),t=document.getElementById("r-t");
  if(left<=0){var nx=REST.next;stopRest();goOn(nx);return}
  if(t)t.textContent=Math.floor(left/60)+":"+pad(left%60);
  if(left<=3&&left!==restTick.last){restTick.last=left;tone(660,0,.12,.15)}
}

function wake(){

}
