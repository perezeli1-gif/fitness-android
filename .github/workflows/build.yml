name: Build APK

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "APPV=$V" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk fitness-sync.apk
          cp app/build/outputs/apk/release/app-release.apk fitness-sync-v$V.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fitness-sync-v${{ env.APPV }}
          path: fitness-sync-v${{ env.APPV }}.apk

      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: יומן כושר - אפליקציית טלפון
          body: "גרסה ${{ env.APPV }}. להתקנה בטלפון, הורד את הקובץ fitness-sync-v${{ env.APPV }}.apk"
          files: |
            fitness-sync.apk
            fitness-sync-v${{ env.APPV }}.apk
          make_latest: true
