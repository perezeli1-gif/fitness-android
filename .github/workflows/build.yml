name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk fitness-sync.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fitness-sync
          path: fitness-sync.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: יומן כושר - אפליקציית טלפון
          body: להתקנה בטלפון, הורד את הקובץ fitness-sync.apk
          files: fitness-sync.apk
          make_latest: true
